<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube Thumbnail Formats — Curated Gallery</title>
<style>
  :root {
    --bg: #0a0a0f; --surface: #141419; --border: #1f1f2e;
    --text: #e4e4e7; --muted: #71717a;
    --accent: #6366f1; --accent2: #818cf8;
    --face: #22c55e; --noface: #f59e0b; --red: #ef4444;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg); color: var(--text);
    padding: 32px; line-height: 1.5;
  }
  h1 { font-size: 2rem; font-weight: 800; margin-bottom: 4px; letter-spacing: -0.02em; }
  .header-sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 32px; }
  .toc { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 40px; }
  .toc a {
    font-size: 0.78rem; color: var(--accent2); text-decoration: none;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 12px; transition: background 0.15s;
  }
  .toc a:hover { background: var(--border); }
  .toc .face-tag { color: var(--face); font-weight: 600; }
  .toc .noface-tag { color: var(--noface); font-weight: 600; }
  .category { margin-bottom: 56px; }
  .cat-header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 6px; }
  .cat-num { font-size: 1.8rem; font-weight: 800; color: var(--accent); opacity: 0.4; }
  .cat-title { font-size: 1.2rem; font-weight: 700; }
  .cat-badge {
    font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.08em;
    padding: 2px 8px; border-radius: 4px; font-weight: 700;
  }
  .cat-badge.face { background: rgba(34,197,94,0.15); color: var(--face); }
  .cat-badge.noface { background: rgba(245,158,11,0.15); color: var(--noface); }
  .cat-count {
    font-size: 0.7rem; color: var(--muted); background: var(--surface);
    border: 1px solid var(--border); padding: 2px 8px; border-radius: 4px;
  }
  .cat-count.thin { color: var(--red); border-color: rgba(239,68,68,0.3); }
  .cat-desc { color: var(--muted); font-size: 0.85rem; margin-bottom: 16px; max-width: 800px; }
  .thumb-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 12px;
  }
  .thumb-grid img {
    width: 100%; border-radius: 8px;
    border: 2px solid var(--border);
    transition: transform 0.15s, border-color 0.15s;
    cursor: pointer; aspect-ratio: 16/9; object-fit: cover;
  }
  .thumb-grid img:hover { transform: scale(1.03); border-color: var(--accent); }
  .lightbox {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.92); z-index: 1000;
    justify-content: center; align-items: center; cursor: pointer;
  }
  .lightbox.active { display: flex; }
  .lightbox img { max-width: 90vw; max-height: 90vh; border-radius: 8px; }
  .footer {
    text-align: center; color: var(--muted); font-size: 0.75rem;
    padding: 32px 0 16px; border-top: 1px solid var(--border);
  }
  .verified-badge {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 0.7rem; color: var(--face); margin-left: 8px;
  }
  @media (max-width: 640px) {
    body { padding: 16px; }
    h1 { font-size: 1.4rem; }
    .thumb-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
  }
</style>
</head>
<body>

<h1>🎬 YouTube Thumbnail Formats <span class="verified-badge">✅ Vision-Verified</span></h1>
<p class="header-sub">14 formats — every thumbnail individually audited by AI vision to confirm it matches its category</p>

<nav class="toc" id="toc"></nav>
<div id="categories"></div>

<div class="lightbox" id="lightbox" onclick="this.classList.remove('active')">
  <img id="lightboxImg" src="" alt="">
</div>

<div class="footer">Each thumbnail verified against strict format criteria · Click to enlarge · ESC to close</div>

<script>
const CATEGORIES = [
  { num: '01', dir: '01-emotional-closeup', title: 'The Emotional Close-Up', face: true, count: 1,
    desc: 'Tight crop of face showing single strong emotion. Face fills 60%+ of frame. Minimal text. Dark/blurred background.' },
  { num: '02', dir: '02-split-screen-vs', title: 'The Split-Screen / VS', face: true, count: 5,
    desc: 'Two people or states divided by clear vertical line or diagonal. Often labeled "VS" with contrasting colors.' },
  { num: '03', dir: '03-bold-text', title: 'The Bold Text Statement', face: false, count: 1,
    desc: '2-4 words in massive bold type against solid background. No face, no real imagery. Text does all the work.' },
  { num: '04', dir: '04-illustrated', title: 'The Illustrated Concept', face: false, count: 8,
    desc: 'Custom illustration or animation-style art. No real photos. Sophisticated palette. Signals intellectual depth.' },
  { num: '05', dir: '05-number-anchor', title: 'The Number Anchor', face: true, count: 1,
    desc: 'Large number dominates ("7", "$10M", "90%") alongside face. The number IS the visual hook.' },
  { num: '06', dir: '06-reaction-object', title: 'The Reaction + Object Combo', face: true, count: 5,
    desc: "Creator's face reacting to a specific object, document, or prop. Arrow/circle highlights the object." },
  { num: '07', dir: '07-before-after', title: 'The Before / After Transformation', face: true, count: 2,
    desc: 'Left = before (struggling). Right = after (thriving). Clear visual progression negative → positive.' },
  { num: '08', dir: '08-mystery-blur', title: 'The Mystery / Blur Reveal', face: false, count: 2,
    desc: 'Key element blurred, redacted, or obscured. Creates information gap requiring a click to resolve.' },
  { num: '09', dir: '09-podcast-twoshot', title: 'The Podcast Two-Shot', face: true, count: 1,
    desc: 'Two faces side by side — host and guest. Clean background, professional lighting. Guest name or pull quote.' },
  { num: '10', dir: '10-whiteboard-framework', title: 'The Whiteboard / Framework', face: false, count: 5,
    desc: 'Framework, diagram, matrix, or flowchart as the main element. Signals proprietary methodology.' },
  { num: '11', dir: '11-story-headline', title: 'The Story Headline', face: false, count: 2,
    desc: 'Styled like a news headline or magazine cover. Large editorial font. Journalistic feel. Text dominates.' },
  { num: '12', dir: '12-emotional-scene', title: 'The Emotional Scene', face: true, count: 5,
    desc: 'Wider shot showing a staged/captured moment. Body language carries the message. Cinematic, not headshot.' },
  { num: '13', dir: '13-minimalist-object', title: 'The Minimalist Object', face: false, count: 1,
    desc: 'Single object centered on clean background. Apple-ad simplicity. Object carries the entire meaning.' },
  { num: '14', dir: '14-quote-card', title: 'The Quote Card', face: true, count: 3,
    desc: "Short punchy quote in large text alongside speaker's photo. The quote itself is the hook." },
];

// Build TOC
const tocEl = document.getElementById('toc');
CATEGORIES.forEach(cat => {
  const a = document.createElement('a');
  a.href = '#cat-' + cat.num;
  const badge = cat.face ? '<span class="face-tag">FACE</span>' : '<span class="noface-tag">NO FACE</span>';
  a.innerHTML = cat.num + '. ' + cat.title + ' ' + badge;
  tocEl.appendChild(a);
});

// Build categories
const catsEl = document.getElementById('categories');
CATEGORIES.forEach(cat => {
  const section = document.createElement('div');
  section.className = 'category';
  section.id = 'cat-' + cat.num;
  const badgeClass = cat.face ? 'face' : 'noface';
  const badgeText = cat.face ? 'FACE' : 'NO FACE';
  const countClass = cat.count < 3 ? 'cat-count thin' : 'cat-count';

  section.innerHTML = '<div class="cat-header">' +
    '<span class="cat-num">' + cat.num + '</span>' +
    '<span class="cat-title">' + cat.title + '</span>' +
    '<span class="cat-badge ' + badgeClass + '">' + badgeText + '</span>' +
    '<span class="' + countClass + '">' + cat.count + ' verified</span>' +
    '</div>' +
    '<p class="cat-desc">' + cat.desc + '</p>' +
    '<div class="thumb-grid" id="grid-' + cat.num + '"></div>';

  catsEl.appendChild(section);

  const grid = document.getElementById('grid-' + cat.num);
  // Try numbered thumbs
  for (let i = 1; i <= 20; i++) {
    const img = document.createElement('img');
    img.src = 'curated/' + cat.dir + '/thumb-' + i + '.jpg';
    img.alt = cat.title + ' example ' + i;
    img.loading = 'lazy';
    img.onerror = function() { this.remove(); };
    img.onclick = function(e) {
      e.stopPropagation();
      document.getElementById('lightboxImg').src = this.src;
      document.getElementById('lightbox').classList.add('active');
    };
    grid.appendChild(img);
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.getElementById('lightbox').classList.remove('active');
});
</script>
</body>
</html>
