<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube Thumbnail Formats — Curated Gallery v2</title>
<style>
  :root {
    --bg: #0a0a0f; --surface: #141419; --border: #1f1f2e;
    --text: #e4e4e7; --muted: #71717a;
    --accent: #6366f1; --accent2: #818cf8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg); color: var(--text);
    padding: 32px; line-height: 1.5;
  }
  h1 { font-size: 2rem; font-weight: 800; margin-bottom: 4px; letter-spacing: -0.02em; }
  .header-sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 32px; }
  .toc { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 40px; }
  .toc a {
    font-size: 0.78rem; color: var(--accent2); text-decoration: none;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 12px; transition: background 0.15s;
  }
  .toc a:hover { background: var(--border); }
  .category { margin-bottom: 56px; }
  .cat-header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 6px; }
  .cat-num { font-size: 1.8rem; font-weight: 800; color: var(--accent); opacity: 0.4; }
  .cat-title { font-size: 1.2rem; font-weight: 700; }
  .cat-count {
    font-size: 0.7rem; color: var(--muted); background: var(--surface);
    border: 1px solid var(--border); padding: 2px 8px; border-radius: 4px;
  }
  .cat-desc { color: var(--muted); font-size: 0.85rem; margin-bottom: 16px; max-width: 800px; }
  .thumb-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 12px;
  }
  .thumb-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; overflow: hidden; transition: transform 0.15s;
  }
  .thumb-card:hover { transform: scale(1.02); }
  .thumb-card img {
    width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block;
  }
  .thumb-label {
    padding: 8px 12px; font-size: 0.72rem; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* Lightbox */
  .lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 100; justify-content: center; align-items: center; cursor: zoom-out; }
  .lightbox.active { display: flex; }
  .lightbox img { max-width: 90vw; max-height: 90vh; border-radius: 8px; }
</style>
</head>
<body>
<h1>YouTube Thumbnail Formats — Curated v2</h1>
<p class="header-sub">53 curated examples across 13 categories. Shorts, low-quality, and before-after removed. Branded channels only.</p>

<nav class="toc" id="toc"></nav>
<main id="gallery"></main>

<div class="lightbox" id="lightbox" onclick="this.classList.remove('active')">
  <img id="lightbox-img" src="" alt="">
</div>

<script>
const categories = [
  { id: "01", dir: "01-emotional-closeup", title: "Emotional Closeup", desc: "Tight face crop, intense expression, direct eye contact. Creates intimacy and emotional pull." },
  { id: "02", dir: "02-split-screen-vs", title: "Split Screen / VS", desc: "Side-by-side comparison, debate format, or contrasting elements with a divider." },
  { id: "03", dir: "03-bold-text", title: "Bold Text Dominant", desc: "Large, high-contrast text is the primary visual element. Face secondary or absent." },
  { id: "04", dir: "04-illustrated", title: "Illustrated / Animated", desc: "Hand-drawn, animated, or illustrated style. No real photography." },
  { id: "05", dir: "05-number-anchor", title: "Number Anchor", desc: "A big number ($, %, count) is the visual hook that drives the click." },
  { id: "06", dir: "06-reaction-object", title: "Reaction + Object", desc: "Person reacting to or holding a product/object. The object drives curiosity." },
  { id: "08", dir: "08-mystery-blur", title: "Mystery / Blur", desc: "Intentionally obscured, blurred, or redacted elements that create curiosity gaps." },
  { id: "09", dir: "09-podcast-twoshot", title: "Podcast Two-Shot", desc: "Two people in interview or podcast framing. Conversation energy." },
  { id: "10", dir: "10-whiteboard-framework", title: "Whiteboard / Framework", desc: "Diagrams, frameworks, visual teaching. The structure IS the thumbnail." },
  { id: "11", dir: "11-story-headline", title: "Story Headline", desc: "News-style or documentary framing. The headline carries the thumbnail." },
  { id: "12", dir: "12-emotional-scene", title: "Emotional Scene", desc: "Movie stills, dramatic scenes, or cinematic moments that evoke feeling." },
  { id: "13", dir: "13-minimalist-object", title: "Minimalist Object", desc: "Clean, minimal composition centered on a single object or very few elements." },
  { id: "14", dir: "14-quote-card", title: "Quote Card", desc: "A quote or text-heavy card layout. The words are the thumbnail." }
];

// File lists per category (hardcoded for reliability)
const files = {
  "01-emotional-closeup": ["AlexHormozi-1.jpg","AlexHormozi-8.jpg","AliAbdaal-7.jpg","CharismaOnCommand-3.jpg"],
  "02-split-screen-vs": ["CharismaOnCommand-1.jpg","Psych2Go-4.jpg","thumb-13.jpg","thumb-14.jpg"],
  "03-bold-text": ["GrahamStephan-1.jpg","HowMoneyWorks-2.jpg","PatrickBoyle-1.jpg","thumb-13.jpg"],
  "04-illustrated": ["thumb-14.jpg","thumb-15.jpg","thumb-2.jpg","thumb-3.jpg","thumb-4.jpg","thumb-5.jpg","thumb-6.jpg","thumb-7.jpg"],
  "05-number-anchor": ["AliAbdaal-3.jpg","thumb-8.jpg"],
  "06-reaction-object": ["thumb-1.jpg","thumb-2.jpg","thumb-4.jpg","thumb-5.jpg","thumb-6.jpg"],
  "08-mystery-blur": ["BusinessInsider-2.jpg","Veritasium-2.jpg","thumb-2.jpg"],
  "09-podcast-twoshot": ["DiaryOfACEO-1.jpg","DiaryOfACEO-3.jpg","thumb-12.jpg"],
  "10-whiteboard-framework": ["AlexHormozi-3.jpg","HBR-2.jpg","thumb-1.jpg","thumb-4.jpg","thumb-5.jpg"],
  "11-story-headline": ["thumb-1.jpg","thumb-3.jpg"],
  "12-emotional-scene": ["thumb-1.jpg","thumb-2.jpg","thumb-4.jpg","thumb-5.jpg","thumb-6.jpg"],
  "13-minimalist-object": ["MKBHD-1.jpg","MattDAvella-2.jpg","TheMinimalists-3.jpg","TheMinimalists-5.jpg"],
  "14-quote-card": ["DiaryOfACEO-2.jpg","DiaryOfACEO-3.jpg","LewisHowes-1.jpg","LewisHowes-3.jpg"]
};

const toc = document.getElementById('toc');
const gallery = document.getElementById('gallery');
const lightbox = document.getElementById('lightbox');
const lbImg = document.getElementById('lightbox-img');

categories.forEach(cat => {
  const imgs = files[cat.dir] || [];
  // TOC
  const a = document.createElement('a');
  a.href = '#cat-' + cat.id;
  a.textContent = cat.id + ' ' + cat.title + ' (' + imgs.length + ')';
  toc.appendChild(a);
  // Category
  const section = document.createElement('div');
  section.className = 'category';
  section.id = 'cat-' + cat.id;
  section.innerHTML = '<div class="cat-header"><span class="cat-num">' + cat.id + '</span><span class="cat-title">' + cat.title + '</span><span class="cat-count">' + imgs.length + ' examples</span></div><p class="cat-desc">' + cat.desc + '</p>';
  const grid = document.createElement('div');
  grid.className = 'thumb-grid';
  imgs.forEach(f => {
    const card = document.createElement('div');
    card.className = 'thumb-card';
    const img = document.createElement('img');
    img.src = cat.dir + '/' + f;
    img.alt = f;
    img.loading = 'lazy';
    img.onclick = function(e) { e.stopPropagation(); lbImg.src = this.src; lightbox.classList.add('active'); };
    const label = document.createElement('div');
    label.className = 'thumb-label';
    label.textContent = f.replace('.jpg','').replace(/-/g,' ');
    card.appendChild(img);
    card.appendChild(label);
    grid.appendChild(card);
  });
  section.appendChild(grid);
  gallery.appendChild(section);
});
</script>
</body>
</html>
